[package]
name = "ponte"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "Ponte: condivide mouse, tastiera e appunti tra PC Linux e Windows con latenza minima"
license = "MIT"
authors = ["Matteo Valenti"]
readme = "README.md"
build = "build.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
dirs = "5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
hex = "0.4"
hkdf = "0.12"
if-addrs = "0.15"
log = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
spake2 = "0.4"
toml = "0.8"
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
libc = "0.2"
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Matteo Valenti"
copyright = "2026, Matteo Valenti"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
Ponte collega due PC (Linux e Windows) via rete locale: muovi mouse e tastiera \
del server sul client oltrepassando il bordo dello schermo e copia/incolla testo \
in entrambe le direzioni. Traffico cifrato con ChaCha20-Poly1305."""
maintainer-scripts = "packaging/linux/debian"
assets = [
    ["target/release/ponte", "usr/bin/", "755"],
    ["packaging/linux/ponte.desktop", "usr/share/applications/", "644"],
    ["assets/ponte-256.png", "usr/share/icons/hicolor/256x256/apps/ponte.png", "644"],
    ["assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/ponte.svg", "644"],
    ["packaging/linux/60-ponte.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/linux/ponte-modules.conf", "usr/lib/modules-load.d/ponte.conf", "644"],
    ["packaging/linux/ponte.service", "usr/lib/systemd/user/", "644"],
    ["README.md", "usr/share/doc/ponte/", "644"],
]
